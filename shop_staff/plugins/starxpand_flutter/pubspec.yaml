name: starxpand_flutter
description: Star Micronics StarXpand bridge for Shop Staff.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: StarxpandFlutterPlugin
      android:
        package: com.example.starxpand_flutter
        pluginClass: StarxpandFlutterPlugin
